<!DOCTYPE html>
<html>
<head>
    <title>Control de Asistencia</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #0f172a;
            color: white;
        }

        h1 {
            margin-top: 40px;
        }

        #mensaje {
            margin-top: 50px;
            font-size: 30px;
        }

        /*input {
            opacity: 0;
        }*/

input {
    opacity: 1;
    font-size: 20px;
}

    </style>
</head>
<body>

<h1>🎓 Control de Asistencia</h1>
<p>Pase su tarjeta...</p>

<input type="text" id="scanner" autofocus>

<div id="mensaje">Esperando escaneo...</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};


firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// 🔥 NOMBRE DEL TALLER
const TALLER = "IMPRESION2";





const input = document.getElementById("scanner");
const mensaje = document.getElementById("mensaje");

let ultimo = "";

input.focus();

input.addEventListener("change", () => {
    const id = input.value.trim();
    input.value = "";

    if (!id || id === ultimo) return;
    ultimo = id;

    setTimeout(() => ultimo = "", 3000);

    registrar(id);
});

const BLOQUEO_MS = 3000;

function registrar(id) {

    const ahora = new Date();
    const fecha = ahora.toISOString().split('T')[0];
    const hora = ahora.toLocaleTimeString();

    db.ref("alumnos/" + id).once("value").then(snapshot => {

        if (!snapshot.exists()) {
            mensaje.innerHTML = "❌ Alumno no registrado";
            return;
        }

        const alumno = snapshot.val();

        // 🔥 REVISAR SI YA ESTÁ ACTIVO
       db.ref("activos/" + id).transaction((actual) => {

    // ✅ SI NO EXISTE → CREAR ACTIVO
    if (actual === null) {

        return {
            taller: TALLER,
            hora: hora
        };
    }

    // ❌ YA EXISTE
    return;

}, async (error, committed, snapshotActivo) => {

    if (error) {

        mensaje.innerHTML = "❌ Error";
        return;
    }

    // =========================================
    // ✅ ENTRADA NUEVA EXITOSA
    // =========================================

    if (committed) {

        // ✅ GUARDAR REGISTRO
        await db.ref("registros/" + id + "/" + fecha).push({
            tipo: "entrada",
            hora: hora,
            taller: TALLER
        });

        mensaje.innerHTML =
            `✅ ENTRADA REGISTRADA<br>
             ${alumno.nombre}<br>
             ${TALLER}`;

        // 🔔 TELEGRAM
        if (alumno.chat_id) {

            notificar(
                alumno.chat_id,
                alumno.nombre,
                "entrada",
                hora
            );
        }

        return;
    }

    // =========================================
    // 🔥 SI NO SE CREÓ → YA EXISTE ACTIVO
    // =========================================

    const activo = snapshotActivo.val();

    // ✅ MISMO TALLER = SALIDA
    if (activo && activo.taller === TALLER) {

        // 🔥 REGISTRAR SALIDA
        await db.ref("registros/" + id + "/" + fecha).push({
            tipo: "salida",
            hora: hora,
            taller: TALLER
        });

        // ❌ ELIMINAR ACTIVO
        await db.ref("activos/" + id).remove();

        mensaje.innerHTML =
            `👋 SALIDA REGISTRADA<br>
             ${alumno.nombre}<br>
             ${TALLER}`;

        // 🔔 TELEGRAM
        if (alumno.chat_id) {

            notificar(
                alumno.chat_id,
                alumno.nombre,
                "salida",
                hora
            );
        }

    }

    // ❌ OTRO TALLER
    else if (activo) {

        mensaje.innerHTML =
            `⛔ Alumno activo en:<br>
             ${activo.taller}`;
    }

});

    });

}
function notificar(chat_id, nombre, tipo, hora) {

    fetch("https://bot-telegram-production-cb3d.up.railway.app/notificar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            chat_id: chat_id,
            nombre: nombre,
            tipo: tipo,
            hora: hora
        })
    })
    .then(() => console.log("✅ Notificación enviada"))
    .catch(err => console.error("❌ Error:", err));
}
</script>

</body>
</html>
