<!DOCTYPE html>
<html>
<head>
    <title>Control Taller</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>

        body{
            font-family: Arial;
            background:#0f172a;
            color:white;
            text-align:center;
        }

        #reader{
            width:300px;
            margin:auto;
            margin-top:20px;
        }

        #mensaje{
            margin-top:30px;
            font-size:25px;
        }

    </style>
</head>
<body>

<h1>🎓 Taller Arduino</h1>

<div id="reader"></div>

<div id="mensaje">
Esperando escaneo...
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const mensaje = document.getElementById("mensaje");

const TALLER = "ESCANEO";

let ultimo = "";
let bloqueo = false;

function registrar(id){

    if(bloqueo) return;

    bloqueo = true;

    setTimeout(()=>{
        bloqueo = false;
    },3000);

    const ahora = new Date();

    const fecha = ahora.toISOString().split('T')[0];

    const hora = ahora.toLocaleTimeString();

    db.ref("alumnos/" + id).once("value").then(snapshot=>{

        if(!snapshot.exists()){

            mensaje.innerHTML = "❌ Alumno no registrado";

            return;
        }

        const alumno = snapshot.val();

        db.ref("activos/" + id).transaction((actual)=>{

            if(actual === null){

                return {
                    taller:TALLER,
                    hora:hora
                };
            }

            return;

        }, async(error, committed, snapActivo)=>{

            if(error){

                mensaje.innerHTML = "❌ Error";

                return;
            }

            // ✅ ENTRADA
            if(committed){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"entrada",
                    hora:hora,
                    taller:TALLER

                });

                mensaje.innerHTML =
                `✅ ENTRADA<br>
                ${alumno.nombre}`;

                return;
            }

            // 🔥 ACTIVO
            const activo = snapActivo.val();

            // ✅ SALIDA
            if(activo && activo.taller === TALLER){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"salida",
                    hora:hora,
                    taller:TALLER

                });

                await db.ref("activos/" + id).remove();

                mensaje.innerHTML =
                `👋 SALIDA<br>
                ${alumno.nombre}`;

            }else{

                mensaje.innerHTML =
                `⛔ Activo en:<br>
                ${activo.taller}`;
            }

        });

    });

}

// 🔥 ESCANER QR / BARRAS

function onScanSuccess(decodedText){

    if(decodedText === ultimo) return;

    ultimo = decodedText;

    setTimeout(()=>{
        ultimo = "";
    },3000);

    registrar(decodedText);

}

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {

    if(devices && devices.length){

        html5QrCode.start(
            devices[0].id,
            {
                fps:10,
                qrbox:250
            },
            onScanSuccess
        );

    }

});

</script>

</body>
</html>
