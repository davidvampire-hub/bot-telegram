<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taller Arduino</title>

<!-- 🔥 LECTOR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    margin:0;
    padding:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:15px;
    margin-bottom:10px;
    font-size:32px;
}

#reader{

    width:100vw !important;
    height:70vh !important;

    margin:auto;

    border:none !important;
}

#reader video{

    width:100% !important;
    height:70vh !important;

    object-fit:cover;

    border:none !important;
}

#reader__scan_region{

    background: transparent !important;
    border: none !important;
}

#reader__scan_region img{

    display:none !important;
}

#reader__dashboard_section{

    display:none !important;
}

#mensaje{

    margin-top:20px;
    font-size:30px;
    font-weight:bold;
    padding:10px;
}

.html5-qrcode-element{
    display:none !important;
}

#reader__dashboard{
    display:none !important;
}

</style>
</head>
<body>

<h1>🎓 Taller Arduino</h1>

<div id="reader"></div>

<div id="mensaje">
Esperando escaneo...
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// =======================================
// 🔥 FIREBASE CONFIG
// =======================================

const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// =======================================
// 🔥 CONFIG
// =======================================

const TALLER = "escaneo";

const mensaje = document.getElementById("mensaje");

let ultimo = "";
let bloqueo = false;

// =======================================
// 🔥 REGISTRAR
// =======================================

function registrar(id){

    if(bloqueo) return;

    bloqueo = true;

    setTimeout(()=>{
        bloqueo = false;
    },3000);

    const ahora = new Date();

    const fecha = ahora.toISOString().split('T')[0];

    const hora = ahora.toLocaleTimeString();

    db.ref("alumnos/" + id).once("value").then(snapshot=>{

        // ❌ NO EXISTE
        if(!snapshot.exists()){

            navigator.vibrate(500);

            mensaje.innerHTML =
                "❌ Alumno no registrado";

            return;
        }

        const alumno = snapshot.val();

        // =======================================
        // 🔥 VALIDAR ACTIVO
        // =======================================

        db.ref("activos/" + id).transaction((actual)=>{

            // ✅ ENTRADA
            if(actual === null){

                return {

                    taller:TALLER,
                    hora:hora

                };
            }

            return;

        }, async(error, committed, snapActivo)=>{

            if(error){

                mensaje.innerHTML = "❌ Error";

                return;
            }

            // =======================================
            // ✅ ENTRADA
            // =======================================

            if(committed){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"entrada",
                    hora:hora,
                    taller:TALLER

                });

                navigator.vibrate(200);

                mensaje.innerHTML =
                `✅ ENTRADA<br><br>
                👨‍🎓 ${alumno.nombre}`;

                // 🔔 TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "entrada",
                        hora
                    );
                }

                return;
            }

            // =======================================
            // 🔥 YA EXISTE ACTIVO
            // =======================================

            const activo = snapActivo.val();

            // ✅ SALIDA
            if(activo && activo.taller === TALLER){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"salida",
                    hora:hora,
                    taller:TALLER

                });

                await db.ref("activos/" + id).remove();

                navigator.vibrate(200);

                mensaje.innerHTML =
                `👋 SALIDA<br><br>
                👨‍🎓 ${alumno.nombre}`;

                // 🔔 TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "salida",
                        hora
                    );
                }

            }

            // ❌ ACTIVO EN OTRO TALLER
            else if(activo){

                navigator.vibrate(700);

                mensaje.innerHTML =
                `⛔ YA ESTÁ EN:<br><br>
                📌 ${activo.taller}`;
            }

        });

    });

}

// =======================================
// 🔔 TELEGRAM
// =======================================

function notificar(chat_id, nombre, tipo, hora){

    fetch("https://bot-telegram-production-cb3d.up.railway.app/notificar", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            chat_id:chat_id,
            nombre:nombre,
            tipo:tipo,
            hora:hora

        })

    })

    .then(()=>{

        console.log("✅ Notificación enviada");

    })

    .catch(err=>{

        console.error("❌ Error:", err);

    });

}

// =======================================
// 📷 CÁMARA
// =======================================

function iniciarCamara(){

    const html5QrCode = new Html5Qrcode(

        "reader",

        {

           formatsToSupport:[

    Html5QrcodeSupportedFormats.CODE_128

]

        }

    );

    html5QrCode.start(

        { facingMode:"environment" },

        {

            fps:25,

           qrbox: {
    width: window.innerWidth,
    height: 350
},

            aspectRatio:1.777,

            disableFlip:true,

           videoConstraints:{

    facingMode:"environment",

    width:{ ideal:1280 },
    height:{ ideal:720 }

}

        },

        (decodedText)=>{

            if(decodedText === ultimo) return;

            ultimo = decodedText;

            setTimeout(()=>{
                ultimo = "";
            },3000);

            registrar(decodedText);

        },

        (errorMessage)=>{
            // ignorar errores
        }

    )

    .catch(err=>{

        console.error(err);

        mensaje.innerHTML =
        "❌ Debes permitir acceso a la cámara";

    });

}

// =======================================
// 🚀 INICIAR
// =======================================

iniciarCamara();

</script>

</body>
</html>
