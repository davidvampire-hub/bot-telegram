<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Congreso Escolar</title>

<!-- 🔥 LECTOR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    margin:0;
    padding:0;
    background:#08112b;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:15px;
    font-size:42px;
    color:#3bb3ff;
}

h2{
    font-size:34px;
    color:#ffd43b;
}

#reader{
    width:95vw;
    max-width:900px;
    margin:auto;
}

#reader video{
    border-radius:20px;
    object-fit:cover !important;
}

#reader{
    position:relative;
}

#reader__scan_region{
    border:4px solid #00ff88 !important;
    border-radius:20px;
}

#mensaje{
    margin-top:20px;
    font-size:30px;
    font-weight:bold;
    padding:15px;
}

.html5-qrcode-element{
    display:none !important;
}

#reader__dashboard{
    display:none !important;
}

#reader__scan_region{
    border:none !important;
}


</style>
</head>
<body>

<h1>🎓 Congreso Escolar</h1>
<h2>📍 Taller: ESCANEO</h2>

<div id="reader"></div>

<div id="mensaje">

    <button onclick="pruebaSheets()">

PROBAR SHEETS

</button>

Esperando escaneo...
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// ======================================
// 🔥 FIREBASE
// ======================================

const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// ======================================
// 🔥 CONFIG
// ======================================

const TALLER = "ESCANEO";

// 🔥 TU APPS SCRIPT
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxUFBiWYGSBCFLAe8LVhffmYYfF1eBl9Dr0T2seIuICV_q58RH7Z7kTZ6iIgZiY2ZUn/exec";

const mensaje = document.getElementById("mensaje");

let ultimoCodigo = "";
let bloqueado = false;

// ======================================
// 🔥 REGISTRAR
// ======================================

function registrar(id){

    if(bloqueado) return;

    bloqueado = true;

    setTimeout(()=>{
        bloqueado = false;
    },2000);

    const ahora = new Date();

    const fecha = ahora.toISOString().split('T')[0];

    const hora = ahora.toLocaleTimeString();

    db.ref("alumnos/" + id).once("value").then(snapshot=>{

        // ❌ NO EXISTE
        if(!snapshot.exists()){

            navigator.vibrate(500);

            mensaje.innerHTML =
            "❌ Alumno no registrado";

            return;
        }

        const alumno = snapshot.val();

        // ======================================
        // 🔥 VALIDAR ACTIVO
        // ======================================

        db.ref("activos/" + id).transaction((actual)=>{

            // ✅ ENTRADA
            if(actual === null){

                return {

                    taller:TALLER,
                    hora:hora

                };
            }

            return;

        }, async(error, committed, snapshotActivo)=>{

            if(error){

                mensaje.innerHTML = "❌ Error";
                return;
            }

            // ======================================
            // ✅ ENTRADA
            // ======================================

            if(committed){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"entrada",
                    hora:hora,
                    taller:TALLER

                });

                // 🔥 SHEETS
                guardarEnSheets(
                    id,
                    alumno.nombre,
                    TALLER,
                    "entrada",
                    hora
                );

                navigator.vibrate(200);

                mensaje.innerHTML = `
                ✅ ENTRADA REGISTRADA
                <br><br>
                👨‍🎓 ${alumno.nombre}
                <br><br>
                📍 ${TALLER}`;

                // 🔔 TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "entrada",
                        hora
                    );
                }

                return;
            }

            // ======================================
            // 🔥 YA EXISTE ACTIVO
            // ======================================

            const activo = snapshotActivo.val();

            // ✅ SALIDA
            if(activo && activo.taller === TALLER){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"salida",
                    hora:hora,
                    taller:TALLER

                });

                // 🔥 SHEETS
                guardarEnSheets(
                    id,
                    alumno.nombre,
                    TALLER,
                    "salida",
                    hora
                );

                await db.ref("activos/" + id).remove();

                navigator.vibrate(200);

                mensaje.innerHTML = `
                👋 SALIDA REGISTRADA
                <br><br>
                👨‍🎓 ${alumno.nombre}
                <br><br>
                📍 ${TALLER}`;

                // 🔔 TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "salida",
                        hora
                    );
                }

            }

            // ❌ OTRO TALLER
            else if(activo){

                navigator.vibrate(700);

                mensaje.innerHTML = `
                ⛔ YA ESTÁ EN:
                <br><br>
                📍 ${activo.taller}`;
            }

        });

    });

}

// ======================================
// 🔥 TELEGRAM
// ======================================

function notificar(chat_id, nombre, tipo, hora){

    fetch("https://bot-telegram-production-cb3d.up.railway.app/notificar", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            chat_id:chat_id,
            nombre:nombre,
            tipo:tipo,
            hora:hora

        })

    })

    .then(()=>{
        console.log("✅ Telegram OK");
    })

    .catch(err=>{
        console.error("❌ Telegram:", err);
    });

}

// ======================================
// 🔥 GOOGLE SHEETS
// ======================================

function guardarEnSheets(id, nombre, taller, tipo, hora){

    const datos = new URLSearchParams();

    datos.append("fecha", new Date().toISOString());
    datos.append("hora", hora);
    datos.append("id", id);
    datos.append("nombre", nombre);
    datos.append("taller", taller);
    datos.append("tipo", tipo);
    datos.append("dispositivo", navigator.platform);

    fetch(URL_SCRIPT, {

        method:"POST",

        mode:"no-cors",

        body:datos

    })

    .then(()=>{

        console.log("✅ Sheets enviado");

    })

    .catch(err=>{

        console.error("❌ Sheets:", err);

    });

}

function pruebaSheets(){

    fetch(URL_SCRIPT, {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            fecha:"TEST",

            hora:"TEST",

            id:"123",

            nombre:"PRUEBA",

            taller:"ESCANEO",

            tipo:"entrada",

            dispositivo:"ANDROID"

        })

    })

    .then(r=>r.text())

    .then(data=>{

        console.log(data);

        alert(data);

    })

    .catch(err=>{

        console.error(err);

        alert(err);

    });

}

// ======================================
// 📷 CAMARA RAPIDA
// ======================================

function iniciarCamara(){

    const html5QrCode = new Html5Qrcode(

        "reader",

        {

            formatsToSupport:[
                Html5QrcodeSupportedFormats.CODE_128
            ]

        }

    );

    html5QrCode.start(

        { facingMode:"environment" },

        {

            fps:8,

           qrbox:{
    width:320,
    height:140
},

            rememberLastUsedCamera:true,

            supportedScanTypes:[
                Html5QrcodeScanType.SCAN_TYPE_CAMERA
            ]

        },

        (decodedText)=>{

            if(decodedText === ultimoCodigo) return;

            ultimoCodigo = decodedText;

            setTimeout(()=>{
                ultimoCodigo = "";
            },2000);

            registrar(decodedText);

        },

        (errorMessage)=>{
            // ignorar
        }

    )

    .catch(err=>{

        console.error(err);

        mensaje.innerHTML =
        "❌ No se pudo abrir la cámara";

    });

}

// ======================================
// 🚀 INICIAR
// ======================================

iniciarCamara();

</script>

</body>
</html>
