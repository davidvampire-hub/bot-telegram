<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Congreso Escolar</title>

<!-- LECTOR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
            font-family: Arial;
            text-align:center;
            background:#0f172a;
            color:white;
            padding:20px;
        }

        #reader{
            width:100%;
            max-width:500px;
            margin:auto;
        }

        #mensaje{
            margin-top:30px;
            font-size:28px;
        }

        h1{
            color:#38bdf8;
        }

        .taller{
            font-size:22px;
            margin-bottom:20px;
            color:#facc15;
        }
</style>
</head>
<body>

<h1>🎓 Congreso Escolar</h1>
<h2>📍 Taller: ESCANEO</h2>

<div id="reader"></div>

<div id="mensaje">
Esperando escaneo...
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// ======================================
// FIREBASE
// ======================================

const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// ======================================
// CONFIG
// ======================================

const TALLER = "ESCANEO";

const mensaje = document.getElementById("mensaje");

let ultimoCodigo = "";
let bloqueado = false;

// ======================================
// REGISTRAR
// ======================================

function registrar(id){

    if(bloqueado) return;

    bloqueado = true;

    setTimeout(()=>{
        bloqueado = false;
    },2500);

    const ahora = new Date();

    const fecha = ahora.toISOString().split('T')[0];

    const hora = ahora.toLocaleTimeString();

    db.ref("alumnos/" + id).once("value").then(snapshot=>{

        // NO EXISTE
        if(!snapshot.exists()){

            navigator.vibrate(500);

            mensaje.innerHTML = "❌ Alumno no registrado";

            return;
        }

        const alumno = snapshot.val();

        // ======================================
        // VALIDAR ACTIVO
        // ======================================

        db.ref("activos/" + id).transaction((actual)=>{

            // ENTRADA
            if(actual === null){

                return {
                    taller:TALLER,
                    hora:hora
                };
            }

            return;

        }, async(error, committed, snapshotActivo)=>{

            if(error){

                mensaje.innerHTML = "❌ Error";
                return;
            }

            // ======================================
            // ENTRADA
            // ======================================

            if(committed){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"entrada",
                    hora:hora,
                    taller:TALLER

                });

                navigator.vibrate(200);

                mensaje.innerHTML = `
                ✅ ENTRADA REGISTRADA
                <br><br>
                👨‍🎓 ${alumno.nombre}
                <br><br>
                📍 ${TALLER}`;

                // TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "entrada",
                        hora
                    );
                }

                return;
            }

            // ======================================
            // YA EXISTE ACTIVO
            // ======================================

            const activo = snapshotActivo.val();

            // SALIDA
            if(activo && activo.taller === TALLER){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"salida",
                    hora:hora,
                    taller:TALLER

                });

                await db.ref("activos/" + id).remove();

                navigator.vibrate(200);

                mensaje.innerHTML = `
                👋 SALIDA REGISTRADA
                <br><br>
                👨‍🎓 ${alumno.nombre}
                <br><br>
                📍 ${TALLER}`;

                // TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "salida",
                        hora
                    );
                }

            }

            // ACTIVO EN OTRO TALLER
            else if(activo){

                navigator.vibrate(700);

                mensaje.innerHTML = `
                ⛔ YA ESTÁ EN:
                <br><br>
                📍 ${activo.taller}`;
            }

        });

    });

}

// ======================================
// TELEGRAM
// ======================================

function notificar(chat_id, nombre, tipo, hora){

    fetch("https://bot-telegram-production-cb3d.up.railway.app/notificar", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            chat_id:chat_id,
            nombre:nombre,
            tipo:tipo,
            hora:hora

        })

    })

    .then(()=>{
        console.log("✅ Notificación enviada");
    })

    .catch(err=>{
        console.error("❌ Error:", err);
    });

}

// ======================================
// CAMARA
// ======================================



// ======================================
// 📷 CAMARA SIMPLE Y ESTABLE
// ======================================
function iniciarCamara(){

    const html5QrCode = new Html5Qrcode("reader");

    Html5Qrcode.getCameras()

    .then(devices => {

        if(devices && devices.length){

            html5QrCode.start(

                { facingMode: "environment" },

                {

                    fps: 15,

                    qrbox: {

                        width: 280,
                        height: 120

                    }

                },

                (decodedText) => {

                    if(decodedText === ultimoCodigo) return;

                    ultimoCodigo = decodedText;

                    setTimeout(()=>{

                        ultimoCodigo = "";

                    },2500);

                    registrar(decodedText);

                }

            );

        }

    })

    .catch(err => {

        console.error(err);

        mensaje.innerHTML =
        "❌ No se pudo abrir la cámara";

    });

}

// ======================================
// 🚀 INICIAR
// ======================================

iniciarCamara();

</script>

</body>
</html>
