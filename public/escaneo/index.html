<!DOCTYPE html>
<html>
<head>
    <title>Control Taller</title>

    <!-- 🔥 LECTOR QR / BARRAS -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>

        body{
            font-family: Arial;
            background:#0f172a;
            color:white;
            text-align:center;
            margin:0;
            padding:20px;
        }

        h1{
            margin-top:20px;
        }

        #reader{
            width:320px;
            margin:auto;
            margin-top:20px;
            border-radius:10px;
            overflow:hidden;
        }

        #mensaje{
            margin-top:30px;
            font-size:25px;
            padding:20px;
        }

    </style>
</head>
<body>

<h1>🎓 Taller Arduino</h1>

<div id="reader"></div>

<div id="mensaje">
Esperando escaneo...
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// =====================================
// 🔥 FIREBASE CONFIG
// =====================================

const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// =====================================
// 🔥 CONFIG TALLER
// =====================================

const TALLER = "ESCANEO";

// =====================================

const mensaje = document.getElementById("mensaje");

let ultimo = "";
let bloqueo = false;

// =====================================
// 🔥 REGISTRAR
// =====================================

function registrar(id){

    if(bloqueo) return;

    bloqueo = true;

    setTimeout(()=>{
        bloqueo = false;
    },3000);

    const ahora = new Date();

    const fecha = ahora.toISOString().split('T')[0];

    const hora = ahora.toLocaleTimeString();

    db.ref("alumnos/" + id).once("value").then(snapshot=>{

        if(!snapshot.exists()){

            mensaje.innerHTML =
                "❌ Alumno no registrado";

            return;
        }

        const alumno = snapshot.val();

        // =====================================
        // 🔥 VALIDAR SI YA ESTÁ ACTIVO
        // =====================================

        db.ref("activos/" + id).transaction((actual)=>{

            // ✅ SI NO EXISTE → ENTRADA
            if(actual === null){

                return {

                    taller:TALLER,
                    hora:hora

                };
            }

            // ❌ YA EXISTE
            return;

        }, async(error, committed, snapActivo)=>{

            if(error){

                mensaje.innerHTML =
                    "❌ Error";

                return;
            }

            // =====================================
            // ✅ ENTRADA
            // =====================================

            if(committed){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"entrada",
                    hora:hora,
                    taller:TALLER

                });

                mensaje.innerHTML =
                `✅ ENTRADA REGISTRADA<br><br>
                👨‍🎓 ${alumno.nombre}<br>
                📌 ${TALLER}`;

                // 🔔 TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "entrada",
                        hora
                    );
                }

                return;
            }

            // =====================================
            // 🔥 YA EXISTE ACTIVO
            // =====================================

            const activo = snapActivo.val();

            // ✅ MISMO TALLER = SALIDA
            if(activo && activo.taller === TALLER){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"salida",
                    hora:hora,
                    taller:TALLER

                });

                // ❌ ELIMINAR ACTIVO
                await db.ref("activos/" + id).remove();

                mensaje.innerHTML =
                `👋 SALIDA REGISTRADA<br><br>
                👨‍🎓 ${alumno.nombre}<br>
                📌 ${TALLER}`;

                // 🔔 TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "salida",
                        hora
                    );
                }

            }

            // ❌ OTRO TALLER
            else if(activo){

                mensaje.innerHTML =
                `⛔ EL ALUMNO YA ESTÁ EN:<br><br>
                📌 ${activo.taller}`;
            }

        });

    });

}

// =====================================
// 🔔 TELEGRAM
// =====================================

function notificar(chat_id, nombre, tipo, hora){

    fetch("https://bot-telegram-production-cb3d.up.railway.app/notificar", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            chat_id:chat_id,
            nombre:nombre,
            tipo:tipo,
            hora:hora

        })

    })

    .then(()=>{

        console.log("✅ Notificación enviada");

    })

    .catch(err=>{

        console.error("❌ Error:", err);

    });

}

// =====================================
// 📷 INICIAR CÁMARA
// =====================================

function iniciarCamara(){

    const html5QrCode = new Html5Qrcode("reader");

    Html5Qrcode.getCameras()

    .then(cameras=>{

        if(!cameras || cameras.length === 0){

            mensaje.innerHTML =
                "❌ No hay cámara";

            return;
        }

        // 🔥 usar cámara trasera
        const camara = cameras[cameras.length - 1].id;

        html5QrCode.start(

            camara,

            {
                fps:10,
                qrbox:250
            },

            (decodedText)=>{

                if(decodedText === ultimo) return;

                ultimo = decodedText;

                setTimeout(()=>{
                    ultimo = "";
                },3000);

                registrar(decodedText);

            },

            (errorMessage)=>{
                // ignorar errores de lectura
            }

        );

    })

    .catch(err=>{

        console.error(err);

        mensaje.innerHTML =
            "❌ Debes permitir acceso a la cámara";

    });

}

// =====================================
// 🚀 INICIAR
// =====================================

iniciarCamara();

</script>

</body>
</html>
