<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Congreso Escolar</title>

<!-- LECTOR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    margin:0;
    padding:0;
    background:#08112b;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:20px;
    font-size:52px;
    color:#3bb3ff;
}

h2{
    color:#ffd43b;
    font-size:42px;
    margin-bottom:20px;
}

#reader{
    width:95vw;
    max-width:900px;
    margin:auto;
    border:none !important;
}

#reader video{
    border-radius:20px;
    object-fit:cover !important;
}

#mensaje{
    margin-top:25px;
    font-size:34px;
    font-weight:bold;
    padding:20px;
}

.html5-qrcode-element{
    display:none !important;
}

#reader__dashboard{
    display:none !important;
}

#reader__scan_region{
    border:none !important;
}

#reader__scan_region img{
    display:none !important;
}

</style>
</head>
<body>

<h1>🎓 Congreso Escolar</h1>
<h2>📍 Taller: ARDUINO</h2>

<div id="reader"></div>

<div id="mensaje">
Esperando escaneo...
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// ======================================
// FIREBASE
// ======================================

const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// ======================================
// CONFIG
// ======================================

const TALLER = "ESCANEO";

const mensaje = document.getElementById("mensaje");

let ultimoCodigo = "";
let bloqueado = false;

// ======================================
// REGISTRAR
// ======================================

function registrar(id){

    if(bloqueado) return;

    bloqueado = true;

    setTimeout(()=>{
        bloqueado = false;
    },2500);

    const ahora = new Date();

    const fecha = ahora.toISOString().split('T')[0];

    const hora = ahora.toLocaleTimeString();

    db.ref("alumnos/" + id).once("value").then(snapshot=>{

        // NO EXISTE
        if(!snapshot.exists()){

            navigator.vibrate(500);

            mensaje.innerHTML = "❌ Alumno no registrado";

            return;
        }

        const alumno = snapshot.val();

        // ======================================
        // VALIDAR ACTIVO
        // ======================================

        db.ref("activos/" + id).transaction((actual)=>{

            // ENTRADA
            if(actual === null){

                return {
                    taller:TALLER,
                    hora:hora
                };
            }

            return;

        }, async(error, committed, snapshotActivo)=>{

            if(error){

                mensaje.innerHTML = "❌ Error";
                return;
            }

            // ======================================
            // ENTRADA
            // ======================================

            if(committed){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"entrada",
                    hora:hora,
                    taller:TALLER

                });

                navigator.vibrate(200);

                mensaje.innerHTML = `
                ✅ ENTRADA REGISTRADA
                <br><br>
                👨‍🎓 ${alumno.nombre}
                <br><br>
                📍 ${TALLER}`;

                // TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "entrada",
                        hora
                    );
                }

                return;
            }

            // ======================================
            // YA EXISTE ACTIVO
            // ======================================

            const activo = snapshotActivo.val();

            // SALIDA
            if(activo && activo.taller === TALLER){

                await db.ref("registros/" + id + "/" + fecha).push({

                    tipo:"salida",
                    hora:hora,
                    taller:TALLER

                });

                await db.ref("activos/" + id).remove();

                navigator.vibrate(200);

                mensaje.innerHTML = `
                👋 SALIDA REGISTRADA
                <br><br>
                👨‍🎓 ${alumno.nombre}
                <br><br>
                📍 ${TALLER}`;

                // TELEGRAM
                if(alumno.chat_id){

                    notificar(
                        alumno.chat_id,
                        alumno.nombre,
                        "salida",
                        hora
                    );
                }

            }

            // ACTIVO EN OTRO TALLER
            else if(activo){

                navigator.vibrate(700);

                mensaje.innerHTML = `
                ⛔ YA ESTÁ EN:
                <br><br>
                📍 ${activo.taller}`;
            }

        });

    });

}

// ======================================
// TELEGRAM
// ======================================

function notificar(chat_id, nombre, tipo, hora){

    fetch("https://bot-telegram-production-cb3d.up.railway.app/notificar", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            chat_id:chat_id,
            nombre:nombre,
            tipo:tipo,
            hora:hora

        })

    })

    .then(()=>{
        console.log("✅ Notificación enviada");
    })

    .catch(err=>{
        console.error("❌ Error:", err);
    });

}

// ======================================
// CAMARA
// ======================================

function iniciarCamara(){

    const qr = new Html5Qrcode("reader");

qr.start(
    { facingMode: "environment" },

    {
        fps: 10,
        qrbox: 250
    },

    async (codigo) => {

        if(codigo === ultimoCodigo) return;

        ultimoCodigo = codigo;

        setTimeout(()=>{
            ultimoCodigo = "";
        },3000);

        registrar(codigo);

    }

)

    .catch(err=>{

        console.error(err);

        mensaje.innerHTML =
        "❌ Debes permitir acceso a la cámara";

    });

}

// ======================================
// INICIAR
// ======================================

iniciarCamara();

</script>

</body>
</html>
