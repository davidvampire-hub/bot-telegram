<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Congreso Escolar CBTis 27</title>

<!-- 🔥 QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial;
    background:
    linear-gradient(
        180deg,
        #3d0008 0%,
        #6b0010 40%,
        #7c0013 100%
    );

    min-height:100vh;

    color:white;

    overflow:hidden;
}

/* 🔥 FONDO TECNOLOGICO */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
    url("https://www.transparenttextures.com/patterns/circuit-board.png");

    opacity:.12;

    pointer-events:none;
}

/* 🔥 CONTENEDOR */

.container{

    width:100%;

    max-width:480px;

    margin:auto;

    padding:10px;

}

/* 🔥 HEADER */

.header{

    text-align:center;

    margin-bottom:8px;
}

.logo{

    width:110px;

    margin:auto;

    display:block;

    margin-bottom:5px;
}

.titulo{

    font-size:42px;

    font-weight:900;

    letter-spacing:1px;
}

.subtitulo{

    color:#ffd8d8;

    font-size:17px;

    margin-top:2px;
}

/* 🔥 TARJETAS */

.card{

    background:white;

    border-radius:18px;

    margin-top:10px;

    overflow:hidden;

    box-shadow:
    0 8px 25px rgba(0,0,0,.25);
}

/* 🔥 ENCABEZADO TARJETA */

.card-header{

    background:
    linear-gradient(
        90deg,
        #7a0012,
        #9f0018
    );

    color:white;

    padding:8px 15px;

    font-size:18px;

    font-weight:bold;
}

/* 🔥 TALLER */

.taller-body{

    display:flex;

    align-items:center;

    gap:18px;

    padding:20px;
}

.icono{

    font-size:60px;

    color:#7a0012;
}

.taller-texto{

    color:#7a0012;
}

.taller-texto span{

    display:block;

    font-size:22px;
}

.taller-texto strong{

    font-size:52px;

    line-height:1;
}

/* 🔥 CAMARA */

#reader{

    width:100%;

    overflow:hidden;

    border-radius:0 0 18px 18px;
}

#reader video{

    object-fit:cover !important;
}

/* 🔥 OCULTAR BOTONES */

.html5-qrcode-element{
    display:none !important;
}

#reader__dashboard{
    display:none !important;
}

#reader__scan_region{
    border:none !important;
}

#reader__scan_region img{
    display:none !important;
}

/* 🔥 ESTADO */

.estado{

    display:flex;

    align-items:center;

    gap:18px;

    padding:18px;
}

.estado-icono{

    width:75px;
    height:75px;

    border-radius:50%;

    background:#7a0012;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:34px;
}

.estado-texto{

    flex:1;
}

.estado-titulo{

    color:#333;

    font-size:34px;

    font-weight:bold;
}

.estado-sub{

    color:#555;

    font-size:18px;
}

/* 🔥 INFO */

.info{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:10px;
}

.info-card{

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.12),
        rgba(255,255,255,.05)
    );

    border:2px solid rgba(255,255,255,.15);

    border-radius:15px;

    padding:12px;

    text-align:center;

    backdrop-filter:blur(5px);
}

.info-icon{

    font-size:28px;

    margin-bottom:5px;
}

.info-label{

    font-size:14px;

    color:#ffdede;
}

.info-value{

    font-size:22px;

    font-weight:bold;

    margin-top:3px;
}

/* 🔥 FOOTER */

.footer{

    text-align:center;

    margin-top:12px;

    color:#ffd7d7;

    font-size:16px;

    padding-bottom:10px;
}

/* 📱 MOVIL */

@media(max-height:800px){

    .titulo{
        font-size:34px;
    }

    .taller-texto strong{
        font-size:40px;
    }

    .estado-titulo{
        font-size:28px;
    }

    .logo{
        width:90px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- 🔥 HEADER -->
    <div class="header">

        <img
        src="https://scontent.fgdl5-3.fna.fbcdn.net/v/t39.30808-6/473667183_1162920999166773_1954077721713265243_n.jpg?_nc_cat=106&ccb=1-7&_nc_sid=a5f93a&_nc_eui2=AeE6vFYVzGtrAYx6mu5xSQZ2zkF1KHzPMAnOQXUofM8wCZEd2TzJ_zkdLbq0BahK_r2bLdV-w2rU67x696dRlEZs&_nc_ohc=vj90W0nL-s8Q7kNvwF1SzUA&_nc_oc=Adq9ncx3UN7TvQycg5PnKvR_imdF1qVXPkrt1aUGlkQFWd7TQIaniSweyplR9XZkZGVLWOT-fa_QzmDm-nmptYxx&_nc_zt=23&_nc_ht=scontent.fgdl5-3.fna&_nc_gid=q_iTOr9Q4qkoW9yiq4CZNw&_nc_ss=7b2a8&oh=00_Af4RA6idUZxtx51v156obBGTGB9F0O7X6qiXHbKB1jTVQQ&oe=6A119BE2"
        class="logo">

        <div class="titulo">
            CONGRESO ESCOLAR
        </div>

        <div class="subtitulo">
            CONTROL DE ASISTENCIA
        </div>

    </div>

    <!-- 🔥 TARJETA TALLER -->
    <div class="card">

        <div class="card-header">
            TALLER ACTIVO
        </div>

        <div class="taller-body">

            <div class="icono">
                ⚙️
            </div>

            <div class="taller-texto">

                <span>TALLER:</span>

                <strong id="nombreTaller">
                    ESCANEO
                </strong>

            </div>

        </div>

    </div>

    <!-- 🔥 TARJETA CAMARA -->
    <div class="card">

        <div class="card-header">
            ESCANEA TU CÓDIGO QR
        </div>

        <div id="reader"></div>

    </div>

    <!-- 🔥 TARJETA ESTADO -->
    <div class="card">

        <div class="card-header">
            ESTADO
        </div>

        <div class="estado">

            <div class="estado-icono">
                📱
            </div>

            <div class="estado-texto">

                <div
                class="estado-titulo"
                id="estadoTitulo">

                    ESPERANDO ESCANEO...

                </div>

                <div
                class="estado-sub"
                id="estadoSub">

                    Listo para registrar entrada o salida

                </div>

            </div>

        </div>

    </div>

    <!-- 🔥 INFO -->
    <div class="info">

        <div class="info-card">

            <div class="info-icon">
                📅
            </div>

            <div class="info-label">
                FECHA
            </div>

            <div
            class="info-value"
            id="fecha">
            </div>

        </div>

        <div class="info-card">

            <div class="info-icon">
                🕒
            </div>

            <div class="info-label">
                HORA
            </div>

            <div
            class="info-value"
            id="hora">
            </div>

        </div>

        <div class="info-card">

            <div class="info-icon">
                👥
            </div>

            <div class="info-label">
                REGISTROS HOY
            </div>

            <div
            class="info-value"
            id="contador">

                0

            </div>

        </div>

        <div class="info-card">

            <div class="info-icon">
                🛡️
            </div>

            <div class="info-label">
                SISTEMA
            </div>

            <div class="info-value"
            style="color:#ffe066">

                ACTIVO

            </div>

        </div>

    </div>

    <!-- 🔥 FOOTER -->
    <div class="footer">

        CBTis 27 · Ixtlán del Río · Nayarit

    </div>

</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// =====================================
// 🔥 FIREBASE
// =====================================

const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// =====================================
// 🔥 GOOGLE SHEETS
// =====================================

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbynZVN1eZ52UsM7x-11k8D6m2l8K0r5n3mtgL15WIjkGW6BnL31Ipu3YkEi9jLLUfgl/exec";

// =====================================
// 🔥 PARAMETROS
// =====================================

const params =
new URLSearchParams(window.location.search);

const taller =
params.get("taller") || "escaneo";

document.getElementById(
"nombreTaller"
).innerHTML =
taller.toUpperCase();

// =====================================
// 🔥 FECHA Y HORA
// =====================================

function actualizarHora(){

    const ahora = new Date();

    document.getElementById("hora")
    .innerHTML =
    ahora.toLocaleTimeString();

    document.getElementById("fecha")
    .innerHTML =
    ahora.toLocaleDateString();

}

setInterval(actualizarHora,1000);

actualizarHora();

// =====================================
// 🔥 CONTADOR
// =====================================

let contador = 0;

// =====================================
// 🔥 SONIDOS
// =====================================

const sonidoEntrada =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);

const sonidoSalida =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/pop.ogg"
);

const sonidoError =
new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

// =====================================
// 🔥 TELEGRAM
// =====================================

function notificar(chat_id,nombre,tipo,hora){

    fetch(
    "https://bot-telegram-production-cb3d.up.railway.app/notificar",
    {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            chat_id:chat_id,
            nombre:nombre,
            tipo:tipo,
            hora:hora

        })

    });

}

// =====================================
// 🔥 SHEETS
// =====================================

function guardarEnSheets(id,nombre,taller,tipo){

    const url =
    URL_SCRIPT
    + "?id=" + encodeURIComponent(id)
    + "&nombre=" + encodeURIComponent(nombre)
    + "&taller=" + encodeURIComponent(taller)
    + "&tipo=" + encodeURIComponent(tipo)
    + "&dispositivo=" + encodeURIComponent(
        navigator.platform
    );

    const iframe =
    document.createElement("iframe");

    iframe.style.display = "none";

    iframe.src = url;

    document.body.appendChild(iframe);

}

// =====================================
// 🔥 DOBLE LECTURA
// =====================================

let ultimoCodigo = "";

// =====================================
// 🔥 CAMARA
// =====================================

const qr =
new Html5Qrcode("reader");

qr.start(

    { facingMode:"environment" },

    {

        fps:20,

        qrbox:{
            width:260,
            height:120
        }

    },

    async(codigo)=>{

        if(codigo === ultimoCodigo) return;

        ultimoCodigo = codigo;

        setTimeout(()=>{
            ultimoCodigo = "";
        },2000);

        registrar(codigo);

    }

);

// =====================================
// 🔥 REGISTRAR
// =====================================

async function registrar(id){

    const estadoTitulo =
    document.getElementById("estadoTitulo");

    const estadoSub =
    document.getElementById("estadoSub");

    estadoTitulo.innerHTML =
    "BUSCANDO...";

    estadoSub.innerHTML =
    "Consultando alumno";

    const ahora = new Date();

    const fecha =
    ahora.toISOString().split('T')[0];

    const hora =
    ahora.toLocaleTimeString();

    const timestamp =
    ahora.getTime();

    // 🔥 BUSCAR ALUMNO
    const snap =
    await db.ref(
        "alumnos/" + id
    ).once("value");

    // ❌ NO EXISTE
    if(!snap.exists()){

        sonidoError.play();

        estadoTitulo.innerHTML =
        "NO REGISTRADO";

        estadoSub.innerHTML =
        "Alumno no encontrado";

        return;
    }

    const alumno = snap.val();

    // 🔥 VALIDAR ACTIVO
    const refActivo =
    db.ref("activos/" + id);

    const activoSnap =
    await refActivo.once("value");

    const activo =
    activoSnap.val();

    // =====================================
    // 🔥 YA ACTIVO
    // =====================================

    if(activo){

        // ✅ MISMO TALLER
        if(activo.taller === taller){

            const minutos =
            (timestamp - activo.timestamp)
            / 60000;

            // ⛔ MENOS DE 10 MIN
            if(minutos < 10){

                sonidoError.play();

                estadoTitulo.innerHTML =
                "ESPERA";

                estadoSub.innerHTML =
                "Deben pasar 10 minutos";

                return;
            }

            // 🔥 SALIDA
            await db.ref(

                "congreso/" +
                taller + "/" +
                fecha + "/" +
                id

            ).push({

                alumno:id,
                nombre:alumno.nombre,
                tipo:"salida",
                hora:hora,
                fecha:fecha,
                taller:taller,
                dispositivo:navigator.userAgent,
                timestamp:timestamp

            });

            await refActivo.remove();

            guardarEnSheets(
                id,
                alumno.nombre,
                taller,
                "salida"
            );

            if(alumno.chat_id){

                notificar(
                    alumno.chat_id,
                    alumno.nombre,
                    "salida",
                    hora
                );
            }

            sonidoSalida.play();

            contador++;

            document.getElementById(
            "contador"
            ).innerHTML = contador;

            estadoTitulo.innerHTML =
            "SALIDA";

            estadoSub.innerHTML =
            alumno.nombre;

            return;
        }

        // ❌ OTRO TALLER
        else{

            sonidoError.play();

            estadoTitulo.innerHTML =
            "OCUPADO";

            estadoSub.innerHTML =
            "Está en " + activo.taller;

            return;
        }

    }

    // =====================================
    // ✅ ENTRADA
    // =====================================

    await db.ref(

        "congreso/" +
        taller + "/" +
        fecha + "/" +
        id

    ).push({

        alumno:id,
        nombre:alumno.nombre,
        tipo:"entrada",
        hora:hora,
        fecha:fecha,
        taller:taller,
        dispositivo:navigator.userAgent,
        timestamp:timestamp

    });

    // 🔥 ACTIVO
    await refActivo.set({

        taller:taller,
        hora:hora,
        timestamp:timestamp

    });

    guardarEnSheets(
        id,
        alumno.nombre,
        taller,
        "entrada"
    );

    if(alumno.chat_id){

        notificar(
            alumno.chat_id,
            alumno.nombre,
            "entrada",
            hora
        );
    }

    sonidoEntrada.play();

    contador++;

    document.getElementById(
    "contador"
    ).innerHTML = contador;

    estadoTitulo.innerHTML =
    "ENTRADA";

    estadoSub.innerHTML =
    alumno.nombre;

}

</script>

</body>
</html>
