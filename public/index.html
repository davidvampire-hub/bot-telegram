<!DOCTYPE html>
<html>
<head>
    <title>Control de Asistencia</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #0f172a;
            color: white;
        }

        h1 {
            margin-top: 40px;
        }

        #mensaje {
            margin-top: 50px;
            font-size: 30px;
        }

        /*input {
            opacity: 0;
        }*/

input {
    opacity: 1;
    font-size: 20px;
}

    </style>
</head>
<body>

<h1>🎓 Control de Asistencia</h1>
<p>Pase su tarjeta...</p>

<input type="text" id="scanner" autofocus>

<div id="mensaje">Esperando escaneo...</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};


firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const input = document.getElementById("scanner");
const mensaje = document.getElementById("mensaje");

let ultimo = "";

input.focus();

input.addEventListener("change", () => {
    const id = input.value.trim();
    input.value = "";

    if (!id || id === ultimo) return;
    ultimo = id;

    setTimeout(() => ultimo = "", 3000);

    registrar(id);
});

function registrar(id) {

    const ahora = new Date();
    const fecha = ahora.toISOString().split('T')[0];
    const hora = ahora.toLocaleTimeString();
    const ahoraMs = ahora.getTime();

    db.ref("alumnos/" + id).once("value").then(snapshot => {

        if (!snapshot.exists()) {
            mensaje.innerHTML = "❌ Alumno no registrado";
            return;
        }

        const alumno = snapshot.val();

        const refDia = db.ref("registros/" + id + "/" + fecha);

        refDia.once("value").then(snap => {

            let ultimo = null;

            snap.forEach(child => {
                ultimo = child.val(); // nos quedamos con el último
            });

            let tipo = "entrada"; // por defecto

            if (ultimo) {

                const ultimaHora = new Date(`${fecha} ${ultimo.hora}`).getTime();
                const minutos = (ahoraMs - ultimaHora) / 60000;
                const horas = minutos / 60;

                // 🚫 BLOQUEO POR DOBLE ESCANEO (10 min)
                if (minutos < 10) {
                    mensaje.innerHTML = "⏳ Ya registraste hace unos minutos";
                    return;
                }

                // 🔁 LÓGICA NORMAL
                if (ultimo.tipo === "entrada") {
                    tipo = "salida";

                    // ⚠️ ALERTA si pasan más de 8 horas sin salida
                    if (horas > 8) {
                        mensaje.innerHTML += "<br>⚠️ No registró salida a tiempo";
                    }

                } else {
                    // si última fue salida
                    if (horas >= 2) {
                        tipo = "entrada"; // puede volver a entrar
                    } else {
                        mensaje.innerHTML = "⛔ Deben pasar al menos 2 horas para volver a entrar";
                        return;
                    }
                }
            }

            // ✅ GUARDAR REGISTRO
            refDia.push({
                hora: hora,
                tipo: tipo,
                timestamp: ahoraMs
            });

            mensaje.innerHTML = `✅ ${tipo.toUpperCase()} registrada<br>${alumno.nombre}`;

            notificar(alumno.telefono, alumno.nombre, tipo, hora);

        });

    });
}
function notificar(telefono, nombre, tipo, hora) {

    const mensaje = `Tu hijo ${nombre} registró ${tipo} a las ${hora}`;

    fetch(`https://api.callmebot.com/whatsapp.php?phone=${telefono}&text=${encodeURIComponent(mensaje)}&apikey=TU_API_KEY`);
}
</script>

</body>
</html>
