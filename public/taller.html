<!DOCTYPE html>
<html>
<head>
    <title>Congreso Escolar</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            font-family: Arial;
            text-align:center;
            background:#0f172a;
            color:white;
            padding:20px;
        }

        #reader{
            width:100%;
            max-width:500px;
            margin:auto;
        }

        #mensaje{
            margin-top:30px;
            font-size:28px;
        }

        h1{
            color:#38bdf8;
        }

        .taller{
            font-size:22px;
            margin-bottom:20px;
            color:#facc15;
        }

    </style>
</head>
<body>

<h1>🎓 Congreso Escolar</h1>

<div class="taller" id="nombreTaller"></div>

<div id="reader"></div>

<div id="mensaje">
    Esperando escaneo...
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const mensaje = document.getElementById("mensaje");


// 🔥 OBTENER TALLER DESDE URL
const params = new URLSearchParams(window.location.search);

const taller = params.get("taller") || "general";

document.getElementById("nombreTaller").innerHTML =
"📍 Taller: " + taller.toUpperCase();


// 🔥 EVITAR DOBLE LECTURA
let ultimoCodigo = "";


// 🔥 INICIAR CÁMARA
const qr = new Html5Qrcode("reader");

qr.start(
    { facingMode: "environment" },

    {
        fps: 10,
        qrbox: 250
    },

    async (codigo) => {

        if(codigo === ultimoCodigo) return;

        ultimoCodigo = codigo;

        setTimeout(()=>{
            ultimoCodigo = "";
        },3000);

        registrar(codigo);

    }

);


// 🔥 REGISTRAR
async function registrar(id){

    const ahora = new Date();

    const fecha = ahora.toISOString().split('T')[0];

    const hora = ahora.toLocaleTimeString();

    const timestamp = ahora.getTime();

    mensaje.innerHTML = "🔍 Buscando alumno...";


    // 🔥 BUSCAR ALUMNO
    const snap = await db.ref("alumnos/" + id).once("value");

    if(!snap.exists()){

        mensaje.innerHTML = "❌ Alumno no encontrado";

        return;
    }

    const alumno = snap.val();


    // 🔥 REGISTROS DEL DÍA
    const refDia = db.ref("congreso/" + taller + "/" + fecha + "/" + id);

    const regSnap = await refDia.once("value");

    let tipo = "entrada";

   let ultimo = null;

regSnap.forEach(child => {

    const dato = child.val();

    if (!ultimo || dato.timestamp > ultimo.timestamp) {
        ultimo = dato;
    }

});


    // 🔥 LÓGICA INTELIGENTE
if (ultimo) {

    const ultimoTiempo = ultimo.timestamp || 0;

    const minutos = (timestamp - ultimoTiempo) / 60000;

    const horas = minutos / 60;

    // ✅ SI LA ÚLTIMA FUE ENTRADA
    if (ultimo.tipo === "entrada") {

        // 🚫 NO PERMITIR SALIDA ANTES DE 10 MIN
        if (minutos < 10) {

            mensaje.innerHTML = `
                ⏳ Deben pasar al menos 10 minutos<br>
                👨‍🎓 ${alumno.nombre}
            `;

            return;
        }

        tipo = "salida";

    }

    // ✅ SI LA ÚLTIMA FUE SALIDA
    else {

        // 🚫 NO REINGRESAR ANTES DE 2 HORAS
        if (horas < 2) {

            mensaje.innerHTML = `
                ⛔ Deben pasar 2 horas para nueva entrada<br>
                👨‍🎓 ${alumno.nombre}
            `;

            return;
        }

        tipo = "entrada";
    }
}


    // 🔥 GUARDAR
    await refDia.push({

        alumno:id,
        nombre:alumno.nombre,
        tipo:tipo,
        hora:hora,
        fecha:fecha,
        taller:taller,
        dispositivo:navigator.userAgent,
        timestamp:timestamp

    });

// 🔥 GOOGLE SHEETS
fetch("https://script.google.com/macros/s/AKfycbwtOyzzLDykWKM59I78KykpQpRaHX7xNT47jCAYKFkB2cd6ig9qlWWZuOuiIK17bfP0/exec", {

    method:"POST",

    body:JSON.stringify({

        fecha:fecha,
        hora:hora,
        id:id,
        nombre:alumno.nombre,
        taller:taller,
        tipo:tipo,
        dispositivo:navigator.userAgent

    })

});




    // 🔥 MENSAJE
    mensaje.innerHTML = `
        ✅ ${tipo.toUpperCase()}<br>
        👨‍🎓 ${alumno.nombre}<br>
        📍 ${taller}
    `;


    // 🔥 TELEGRAM
    if(alumno.chat_id){

        fetch("/notificar", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                chat_id:alumno.chat_id,

                nombre:alumno.nombre,

                tipo:tipo,

                hora:hora,

                taller:taller

            })

        });

    }

}

</script>

</body>
</html>
