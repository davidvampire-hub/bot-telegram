<!DOCTYPE html>
<html>
<head>
    <title>Congreso Escolar - CBTis 25</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial;
            text-align:center;
            background:#f5f5f5;
            color:#222;
            min-height:100vh;
            padding:20px;
        }

        .contenedor{

            max-width:500px;
            margin:auto;
            background:white;
            border-radius:30px;
            padding:25px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);

        }

        .logo{

            width:180px;
            margin:auto;
            display:block;
            margin-bottom:15px;

        }

        h1{

            color:#7a0012;
            font-size:38px;
            margin-bottom:10px;

        }

        .subtitulo{

            font-size:18px;
            color:#555;
            margin-bottom:20px;

        }

        .taller{

            background:#7a0012;
            color:white;
            font-size:24px;
            font-weight:bold;
            padding:15px;
            border-radius:15px;
            margin-bottom:20px;

        }

        #reader{

            width:100%;
            overflow:hidden;
            border-radius:25px;
            border:6px solid #7a0012;

        }

        #reader video{

            border-radius:20px;
            object-fit:cover !important;

        }

        #mensaje{

            margin-top:25px;
            font-size:28px;
            font-weight:bold;
            padding:20px;
            border-radius:20px;
            background:#f3f4f6;
            color:#111;

        }

        .html5-qrcode-element{
            display:none !important;
        }

        #reader__dashboard{
            display:none !important;
        }

        #reader__scan_region{
            border:none !important;
        }

        .footer{

            margin-top:20px;
            color:#666;
            font-size:14px;

        }

    </style>
</head>
<body>

<div class="contenedor">

    <!-- 🔥 LOGO -->
    <img
        src="https://scontent.fgdl5-3.fna.fbcdn.net/v/t39.30808-6/473667183_1162920999166773_1954077721713265243_n.jpg?_nc_cat=106&ccb=1-7&_nc_sid=a5f93a&_nc_eui2=AeE6vFYVzGtrAYx6mu5xSQZ2zkF1KHzPMAnOQXUofM8wCZEd2TzJ_zkdLbq0BahK_r2bLdV-w2rU67x696dRlEZs&_nc_ohc=vj90W0nL-s8Q7kNvwF1SzUA&_nc_oc=Adq9ncx3UN7TvQycg5PnKvR_imdF1qVXPkrt1aUGlkQFWd7TQIaniSweyplR9XZkZGVLWOT-fa_QzmDm-nmptYxx&_nc_zt=23&_nc_ht=scontent.fgdl5-3.fna&_nc_gid=q_iTOr9Q4qkoW9yiq4CZNw&_nc_ss=7b2a8&oh=00_Af4RA6idUZxtx51v156obBGTGB9F0O7X6qiXHbKB1jTVQQ&oe=6A119BE2"
        class="logo"
    >

    <h1>Congreso Escolar</h1>

    <div class="subtitulo">
        CBTis 25 - Nayarit
    </div>

    <div
        class="taller"
        id="nombreTaller">
    </div>

    <!-- 📷 CAMARA -->
    <div id="reader"></div>

    <!-- 🔥 MENSAJE -->
    <div id="mensaje">
        Esperando escaneo...
    </div>

    <div class="footer">
        Sistema de Control de Asistencia
    </div>

</div>

<!-- QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

// =====================================
// 🔥 FIREBASE
// =====================================

const firebaseConfig = {

  apiKey: "AIzaSyCWQAmB9cMI4Y0YBPC_iV6p1YGgZTSNFQ0",

  authDomain: "controlasistencia-d236e.firebaseapp.com",

  databaseURL: "https://controlasistencia-d236e-default-rtdb.firebaseio.com",

  projectId: "controlasistencia-d236e",

  storageBucket: "controlasistencia-d236e.firebasestorage.app",

  messagingSenderId: "3052247103",

  appId: "1:3052247103:web:eaed021913fa765427808a",

  measurementId: "G-H9EKB1F7ZW"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// =====================================
// 🔥 GOOGLE SHEETS
// =====================================

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbynZVN1eZ52UsM7x-11k8D6m2l8K0r5n3mtgL15WIjkGW6BnL31Ipu3YkEi9jLLUfgl/exec";

// =====================================
// 🔥 ELEMENTOS
// =====================================

const mensaje = document.getElementById("mensaje");

// =====================================
// 🔥 OBTENER TALLER
// =====================================

const params = new URLSearchParams(window.location.search);

const taller = params.get("taller") || "general";

document.getElementById("nombreTaller").innerHTML =
"📍 TALLER: " + taller.toUpperCase();

// =====================================
// 🔥 EVITAR DOBLE LECTURA
// =====================================

let ultimoCodigo = "";

// =====================================
// 🔔 TELEGRAM
// =====================================

function notificar(chat_id, nombre, tipo, hora){

    fetch(
        "https://bot-telegram-production-cb3d.up.railway.app/notificar",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                chat_id:chat_id,
                nombre:nombre,
                tipo:tipo,
                hora:hora

            })

        }
    )

    .then(()=>{
        console.log("✅ Telegram enviado");
    })

    .catch(err=>{
        console.error("❌ Telegram:", err);
    });

}

// =====================================
// 📄 GOOGLE SHEETS
// =====================================

function guardarEnSheets(id, nombre, taller, tipo){

    const url =
    URL_SCRIPT
    + "?id=" + encodeURIComponent(id)
    + "&nombre=" + encodeURIComponent(nombre)
    + "&taller=" + encodeURIComponent(taller)
    + "&tipo=" + encodeURIComponent(tipo)
    + "&dispositivo=" + encodeURIComponent(
        navigator.platform
      );

    const iframe = document.createElement("iframe");

    iframe.style.display = "none";

    iframe.src = url;

    document.body.appendChild(iframe);

    console.log("✅ Sheets enviado");

}

// =====================================
// 📷 INICIAR CAMARA
// =====================================

const qr = new Html5Qrcode("reader");

qr.start(

    { facingMode: "environment" },

    {

        fps: 20,

        qrbox: {
            width: 280,
            height: 120
        }

    },

    async (codigo) => {

        if(codigo === ultimoCodigo) return;

        ultimoCodigo = codigo;

        setTimeout(()=>{

            ultimoCodigo = "";

        },2000);

        registrar(codigo);

    }

);

// =====================================
// 🔊 SONIDOS
// =====================================

const sonidoEntrada = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);

const sonidoSalida = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/pop.ogg"
);

const sonidoError = new Audio(
    "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

// =====================================
// 🔥 REGISTRAR
// =====================================

async function registrar(id){

    const ahora = new Date();

    const fecha = ahora.toISOString().split('T')[0];

    const hora = ahora.toLocaleTimeString();

    const timestamp = ahora.getTime();

    mensaje.innerHTML = "🔍 Buscando alumno...";

    // =====================================
    // 🔥 BUSCAR ALUMNO
    // =====================================

    const snap = await db.ref("alumnos/" + id).once("value");

    if(!snap.exists()){

        mensaje.style.background = "#fee2e2";
        mensaje.style.color = "#991b1b";

        mensaje.innerHTML = "❌ Alumno no encontrado";

        navigator.vibrate(500);

        sonidoError.play();

        return;
    }

    const alumno = snap.val();

    // =====================================
    // 🔥 VALIDAR ACTIVO GLOBAL
    // =====================================

    const refActivo = db.ref("activos/" + id);

    const activoSnap = await refActivo.once("value");

    const activo = activoSnap.val();

    // =====================================
    // 🔥 YA EXISTE ACTIVO
    // =====================================

    if(activo){

        // =====================================
        // ✅ MISMO TALLER = SALIDA
        // =====================================

        if(activo.taller === taller){

            const minutos =
            (timestamp - activo.timestamp) / 60000;

            if(minutos < 10){

                sonidoError.play();

                mensaje.style.background = "#fef3c7";
                mensaje.style.color = "#92400e";

                mensaje.innerHTML = `
                    ⏳ Deben pasar 10 minutos
                    <br><br>
                    👨‍🎓 ${alumno.nombre}
                `;

                return;
            }

            await db.ref(

                "congreso/" +
                taller + "/" +
                fecha + "/" +
                id

            ).push({

                alumno:id,
                nombre:alumno.nombre,
                tipo:"salida",
                hora:hora,
                fecha:fecha,
                taller:taller,
                dispositivo:navigator.userAgent,
                timestamp:timestamp

            });

            // ❌ ELIMINAR ACTIVO
            await refActivo.remove();

            // 📄 SHEETS
            guardarEnSheets(
                id,
                alumno.nombre,
                taller,
                "salida"
            );

            // 🔔 TELEGRAM
            if(alumno.chat_id){

                notificar(
                    alumno.chat_id,
                    alumno.nombre,
                    "salida",
                    hora
                );
            }

            navigator.vibrate(200);

            sonidoSalida.play();

            mensaje.style.background = "#dbeafe";
            mensaje.style.color = "#1e3a8a";

            mensaje.innerHTML = `
                👋 SALIDA REGISTRADA
                <br><br>
                👨‍🎓 ${alumno.nombre}
                <br>
                📍 ${taller.toUpperCase()}
            `;

            return;
        }

        // =====================================
        // ❌ ACTIVO EN OTRO TALLER
        // =====================================

        else{

            navigator.vibrate(700);

            sonidoError.play();

            mensaje.style.background = "#fee2e2";
            mensaje.style.color = "#991b1b";

            mensaje.innerHTML = `
                ⛔ YA ESTÁ EN:
                <br><br>
                📍 ${activo.taller.toUpperCase()}
            `;

            return;
        }

    }

    // =====================================
    // ✅ NUEVA ENTRADA
    // =====================================

    await db.ref(

        "congreso/" +
        taller + "/" +
        fecha + "/" +
        id

    ).push({

        alumno:id,
        nombre:alumno.nombre,
        tipo:"entrada",
        hora:hora,
        fecha:fecha,
        taller:taller,
        dispositivo:navigator.userAgent,
        timestamp:timestamp

    });

    // ✅ MARCAR ACTIVO
    await refActivo.set({

        taller:taller,
        hora:hora,
        timestamp:timestamp

    });

    // 📄 SHEETS
    guardarEnSheets(
        id,
        alumno.nombre,
        taller,
        "entrada"
    );

    // 🔔 TELEGRAM
    if(alumno.chat_id){

        notificar(
            alumno.chat_id,
            alumno.nombre,
            "entrada",
            hora
        );
    }

    navigator.vibrate(200);

    sonidoEntrada.play();

    mensaje.style.background = "#dcfce7";
    mensaje.style.color = "#166534";

    mensaje.innerHTML = `
        ✅ ENTRADA REGISTRADA
        <br><br>
        👨‍🎓 ${alumno.nombre}
        <br>
        📍 ${taller.toUpperCase()}
    `;

}

</script>

</body>
</html>
